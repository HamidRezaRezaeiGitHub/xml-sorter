# Test Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Test User Mock Data Configuration
app.user.mock-data.enabled=true
app.user.mock-data.users[0].username=test_user1
app.user.mock-data.users[0].email=test1@example.com
app.user.mock-data.users[0].first-name=Test
app.user.mock-data.users[0].last-name=User1
app.user.mock-data.users[1].username=test_user2
app.user.mock-data.users[1].email=test2@example.com
app.user.mock-data.users[1].first-name=Test
app.user.mock-data.users[1].last-name=User2

# Logging Configuration for Tests
logging.level.dev.hrrezaei.xml.sorter=DEBUG