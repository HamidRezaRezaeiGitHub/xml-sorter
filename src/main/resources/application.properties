spring.application.name=sorter

# Server Configuration
server.port=8080

# Logging Configuration
logging.level.root=INFO

# Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# User Mock Data Configuration
app.user.mock-data.enabled=false
app.user.mock-data.users[0].username=john_doe
app.user.mock-data.users[0].email=john.doe@example.com
app.user.mock-data.users[0].first-name=John
app.user.mock-data.users[0].last-name=Doe
app.user.mock-data.users[1].username=jane_smith
app.user.mock-data.users[1].email=jane.smith@example.com
app.user.mock-data.users[1].first-name=Jane
app.user.mock-data.users[1].last-name=Smith